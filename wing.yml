services:
  sparkmaster:
    image: sdesilva26/spark_master:latest
    #security_opt:
    #  - no-new-privileges
    #deploy:
    #  resources:
    #    limits:
    #      cpus: '0.50'
    #      memory: 512M
    #    reservations:
    #      cpus: '0.25'
    #      memory: 128M
    ports:
     - "7077:7077"
    networks:
     - spark
    #cap_drop:
    # - ALL
    volumes:
     - "/home/admin/workspace/England:/media:ro"
    command:
      /spark/bin/spark-class org.apache.spark.deploy.master.Master

  sparkworker:
    image: sdesilva26/spark_worker:latest
 #   security_opt:
 #     - no-new-privileges
#    deploy:
#      replicas: 4
 #     resources:
 #       limits:
 #         cpus: '0.50'
 #         memory: 512M
 #       reservations:
 #         cpus: '0.25'
 #         memory: 128M
    networks:
     - spark
 #   cap_drop:
 #    - ALL
    ports:
     - "8081:8081"
    volumes:
     - "/home/admin/workspace/England:/media:ro"
    command: >
      /spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://54.197.11.207:7077

  cassandra:
    image: cassandra:3.11.3
#    security_opt:
#      - no-new-privileges
#    deploy:
#      resources:
#        limits:                                                                                      
#          cpus: '0.50'
#          memory: 512M
#        reservations:
#          cpus: '0.25'
#          memory: 128M
    networks:
     - spark
    environment:
     - CASSANDRA_CLUSTER_NAME=cscie63_cluster

  zookeeper:
    image: zookeeper
#    security_opt:
#      - no-new-privileges
#    deploy:
#      resources:
#        limits:
#          cpus: '0.50'
#          memory: 512M
#        reservations:
#          cpus: '0.25'
#          memory: 128M
    networks:
     - spark

  kafka:
    image: bitnami/kafka
#    security_opt:
#      - no-new-privileges
#    deploy:
#      resources:
#        limits:
#          cpus: '0.50'
#          memory: 512M
#        reservations:
#          cpus: '0.25'
#          memory: 128M
    networks:
      - spark
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_ADVERTISED_HOST_NAME: PLAINTEXT://54.197.11.207
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_CREATE_TOPICS: "engine-stream-1:1:1,engine-stream-2:1:1,engine-stream-3:1:1,engine-stream-4:1:1,engine-stream-5:1:1,engine-stream-6:1:1,engine-alert:1:1"
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://54.197.11.207:9092
    depends_on:
      - zookeeper

networks:
  spark:
    driver: bridge
    attachable: true
#  kafka:
#    driver: bridge
#    attachable: true

